global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: easyshop

rule_files:
  - /etc/prometheus/rules/easyshop-slo.yml

scrape_configs:
  - job_name: easyshop-api
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["easyshop-api:4000"]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/easyshop-metrics-token
