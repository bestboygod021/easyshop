name: API container image

on:
  pull_request:
  push:
    tags:
      - 'v*'

concurrency:
  group: api-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build without publishing
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}/api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Validate stable release tag and merged source commit
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use stable vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "Release tag must point to a commit already merged into the default branch." >&2
            exit 1
          fi
      - name: Derive OCI tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
      - name: Build for validation only (no registry push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            NODE_BASE_IMAGE=${{ vars.NODE_BASE_IMAGE || 'node:22.22.3-bookworm-slim' }}
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report validation result
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Dockerfile validation succeeded; this job never publishes." >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate digest: \`${IMAGE_DIGEST:-not-reported}\`" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish and attest approved OCI release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.OCI_RELEASE_ENABLED == '1'
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: oci-release
    permissions:
      contents: read
      deployments: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release environment has independent approval and tag restrictions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const apiBase = String(process.env.GITHUB_API_URL || '').replace(/\/$/, '');
          const repository = process.env.GITHUB_REPOSITORY;
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'x-github-api-version': '2022-11-28',
          };
          const environmentUrl = `${apiBase}/repos/${repository}/environments/oci-release`;
          const environmentResponse = await fetch(environmentUrl, { headers });
          if (!environmentResponse.ok) {
            throw new Error(`OCI release environment could not be verified (HTTP ${environmentResponse.status}).`);
          }
          const environment = await environmentResponse.json();
          const hasIndependentReviewer = (environment.protection_rules || []).some((rule) =>
            rule.type === 'required_reviewers'
            && rule.prevent_self_review === true
            && Array.isArray(rule.reviewers)
            && rule.reviewers.length > 0);
          if (!hasIndependentReviewer) {
            throw new Error('OCI release environment must require an independent reviewer and prevent self-review.');
          }
          if (environment.deployment_branch_policy?.custom_branch_policies !== true) {
            throw new Error('OCI release environment must restrict deployments to an explicit tag policy.');
          }
          const policiesUrl = `${environmentUrl}/deployment-branch-policies?per_page=100`;
          const policiesResponse = await fetch(policiesUrl, { headers });
          if (!policiesResponse.ok) {
            throw new Error(`OCI release tag policy could not be verified (HTTP ${policiesResponse.status}).`);
          }
          const policies = await policiesResponse.json();
          const allowsVersionTags = (policies.branch_policies || []).some((policy) =>
            policy.type === 'tag' && policy.name === 'v*');
          if (!allowsVersionTags) {
            throw new Error('OCI release environment must explicitly allow the v* tag pattern.');
          }
          console.log('OCI release environment has a non-self reviewer and an explicit v* tag policy.');
          NODE
      - name: Require a digest-pinned Node base for publication
        env:
          NODE_BASE_IMAGE: ${{ vars.NODE_BASE_IMAGE }}
        shell: bash
        run: |
          if [[ ! "$NODE_BASE_IMAGE" =~ ^node:22\.[0-9]+\.[0-9]+-bookworm-slim@sha256:[a-f0-9]{64}$ ]]; then
            echo "Set NODE_BASE_IMAGE to a reviewed Node 22 Bookworm image pinned by sha256 digest." >&2
            exit 1
          fi
      - name: Derive immutable release image tag
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish with SBOM/provenance
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            NODE_BASE_IMAGE=${{ vars.NODE_BASE_IMAGE }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign published image digest with GitHub OIDC
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${IMAGE_DIGEST}"
      - name: Attest published image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Create redacted release evidence manifest
        env:
          OCI_IMAGE: ${{ env.IMAGE }}
          OCI_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          NODE_BASE_IMAGE: ${{ vars.NODE_BASE_IMAGE }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: node tools/create-release-evidence.mjs artifacts/oci-release-evidence.json
      - name: Attest the release evidence manifest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/oci-release-evidence.json
      - name: Upload immutable release evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: oci-release-evidence-${{ github.ref_name }}
          path: artifacts/oci-release-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Report published digest and evidence
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Published image digest: \`${IMAGE_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Signed image and attested release evidence are attached to this run." >> "$GITHUB_STEP_SUMMARY"
