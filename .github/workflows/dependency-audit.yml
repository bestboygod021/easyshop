name: Scheduled dependency audit

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit locked npm dependency trees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Audit workspaces, desktop, and mobile lockfiles
        run: npm run supplychain:audit
      - name: Upload all npm audit JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easyshop-dependency-audit-${{ github.run_id }}
          path: artifacts/dependency-audit/*.json
          if-no-files-found: error
          retention-days: 90
